    .pie .derechos { font-size: 11px; margin-bottom: 1px; }
  }
</style>

</head>

<body>

    <div class="ficha-cuerpo" id="fichaCuerpo"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

/* =========================================================
   1. DATOS Y UTILIDADES
   ========================================================= */
const D = JSON.parse(document.getElementById('datos').textContent);
const $ = (id) => document.getElementById(id);
const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const REG = Object.fromEntries(D.regiones.map(r => [r.id, r]));
const DROGA = Object.fromEntries(D.drogas.map(d => [d.id, d]));
const COLOR_FONDO_SIN_REGION = new THREE.Color('#5d6b7e');   // se cambia con el tema
const COLOR_CORTEZA_BASE = new THREE.Color(REG.corteza_cerebral.color);

/* Estado de la interfaz */
const estado = { region: null, droga: null, opacidad: 1, separacion: 0, sustanciaBlanca: false };

/* =========================================================
   2. ESCENA
   ========================================================= */
const cont = $('lienzo');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, window.matchMedia('(max-width: 900px)').matches ? 1.5 : 2));
cont.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0f26);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
/* Encuadre: distancia a la que un objeto de radio `radio` ocupa `fraccion` del lado más corto de la vista */
function distanciaPara(radio, fraccion) {
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return radio / (fraccion * Math.min(tanV, tanV * camera.aspect));
}
const DIR_VISTA = new THREE.Vector3(3.2, 1.6, 3.4).normalize();   // dirección inicial (algo desde arriba y de lado)
const RADIO_CEREBRO = 1.15, FRACCION_CEREBRO = 0.8;               // el cerebro completo llena ~70 % de la vista
const VISTA_INICIAL = {
  get pos() { return DIR_VISTA.clone().multiplyScalar(distanciaPara(RADIO_CEREBRO, FRACCION_CEREBRO)); },
  target: new THREE.Vector3(0, 0, 0)
};
camera.position.copy(VISTA_INICIAL.pos);

const luzHemi = new THREE.HemisphereLight(0xffffff, 0x445066, 1.1);
scene.add(luzHemi);
const luz = new THREE.DirectionalLight(0xffffff, 1.6);
camera.add(luz); luz.position.set(1, 2, 3); scene.add(camera);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 1.1;
controls.maxDistance = 9;
controls.autoRotateSpeed = 1.2;

/* Render bajo demanda: se dibuja solo si algo cambió (cámara, colores, opacidad, tema, tamaño). Ahorra batería y calor en el celular. */
let renderPendiente = 3;
function pedirRender() { renderPendiente = 3; }

let autoEncuadre = true, tReencuadre = null;
function ajustarTamano() {
  const w = cont.clientWidth, h = cont.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  pedirRender();
  clearTimeout(tReencuadre); tReencuadre = setTimeout(reencuadrar, 150);   // al cambiar el tamaño (girar el celular, abrir la ficha)
}
new ResizeObserver(ajustarTamano).observe(cont);

/* raíz del modelo: se centra y se escala a ~2 unidades */
const raiz = new THREE.Group();
scene.add(raiz);

/* =========================================================
   3. CARGA DEL MODELO (o formas simples si falta el .glb)
   ========================================================= */
let mallas = [];            // todas las mallas del cerebro
let centroModelo = new THREE.Vector3();

function prepararMalla(m) {
  // Cada pieza tiene su propio material para controlar color y opacidad por separado
  const base = Array.isArray(m.material) ? m.material[0] : m.material;
  m.material = new THREE.MeshStandardMaterial({
    color: 0x888888, roughness: 0.55, metalness: 0, transparent: true, opacity: 1,
    side: THREE.FrontSide   // una sola pasada por pieza (rendimiento)
  });
  if (base && base.map) m.material.map = null;
  m.userData.nombreNorm = norm(m.name);
  m.userData.oculta = (D.modelo.ocultarPorDefecto || []).some(t => m.userData.nombreNorm.includes(norm(t)));
  m.userData.opActual = 1;
  m.userData.hov = 0;
  m.userData.colActual = new THREE.Color(0x888888);
  m.geometry.computeBoundingBox();
  // Caja de la pieza en el espacio de la escena (el .glb comprimido cuantiza la geometría y le pone escala y traslación al nodo)
  m.updateWorldMatrix(true, false);
  const relativa = new THREE.Matrix4().copy(raiz.matrixWorld).invert().multiply(m.matrixWorld);   // sin la escala/posición de la raíz
  m.userData.caja = m.geometry.boundingBox.clone().applyMatrix4(relativa);
  m.userData.centro = m.userData.caja.getCenter(new THREE.Vector3());
  m.userData.posBase = m.position.clone();
  mallas.push(m);
}

/* ATV: el modelo no la trae. Forma simple y aproximada dentro de midbrain_tegmentum:
   dos formas alargadas (una a cada lado de la línea media), hacia abajo y adelante en el tegmento. */
function crearATV() {
  const teg = mallas.filter(m => m.userData.nombreNorm.includes('midbrain_tegmentum'));
  if (!teg.length) return;
  const caja = new THREE.Box3();
  teg.forEach(m => caja.union(m.userData.caja));
  const t = caja.getSize(new THREE.Vector3());
  const cx = (caja.min.x + caja.max.x) / 2, cy = caja.min.y + t.y * 0.3, cz = caja.min.z + t.z * 0.68;
  [['L', -1], ['R', 1]].forEach(([lado, signo]) => {
    const g = new THREE.SphereGeometry(1, 24, 16);
    g.scale(0.0028, 0.0032, 0.0075);                 // alargada de adelante hacia atrás
    g.rotateX(-0.3); g.rotateY(signo * 0.25);        // leve inclinación, como un abanico
    g.translate(cx + signo * 0.0042, cy, cz);
    const m = new THREE.Mesh(g); m.name = 'VTA_referencial_' + lado;
    raiz.add(m); prepararMalla(m);
  });
}

function formasSimples() {
  // Respaldo para probar la interfaz sin cerebro.glb. Los nombres imitan al modelo real.
  const defs = [
    ['Allen_brain_outline', [0, 0, 0], [0.9, 0.7, 1.1]],
    ['Allen_superior_frontal_gyrus_L', [-0.3, 0.25, 0.8], [0.35, 0.3, 0.3]],
    ['Allen_superior_frontal_gyrus_R', [0.3, 0.25, 0.8], [0.35, 0.3, 0.3]],
    ['Allen_amygdaloid_complex_L', [-0.4, -0.2, 0.2], [0.12, 0.12, 0.12]],
    ['Allen_amygdaloid_complex_R', [0.4, -0.2, 0.2], [0.12, 0.12, 0.12]],
    ['Allen_body_of_hippocampus_L', [-0.4, -0.2, -0.2], [0.1, 0.1, 0.35]],
    ['Allen_body_of_hippocampus_R', [0.4, -0.2, -0.2], [0.1, 0.1, 0.35]],
    ['Allen_nucleus_accumbens_L', [-0.12, -0.15, 0.5], [0.08, 0.08, 0.08]],
    ['Allen_nucleus_accumbens_R', [0.12, -0.15, 0.5], [0.08, 0.08, 0.08]],
    ['Allen_substantia_nigra_L', [-0.1, -0.45, -0.1], [0.06, 0.06, 0.06]],
    ['Allen_substantia_nigra_R', [0.1, -0.45, -0.1], [0.06, 0.06, 0.06]],
  ];
  defs.forEach(([n, p, s]) => {
    const g = new THREE.SphereGeometry(1, 24, 16); g.scale(...s); g.translate(...p);
    const m = new THREE.Mesh(g); m.name = n; raiz.add(m); prepararMalla(m);
  });
}

async function cargarModelo() {
  const cargador = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
  const archivos = [D.modelo.archivoComprimido, D.modelo.archivo].filter(Boolean);
  let gltf = null, usado = null;
  for (const archivo of archivos) {
    try {
      gltf = await cargador.loadAsync(archivo, (e) => {
        if (e.total) $('estado').textContent = 'Cargando modelo… ' + Math.round(e.loaded / e.total * 100) + '%';
      });
      usado = archivo; break;
    } catch (err) {
      console.warn('No se pudo cargar ' + archivo + (archivo !== archivos[archivos.length - 1] ? ', se prueba el siguiente.' : '.'), err);
    }
  }
  if (!gltf) {
    formasSimples();
    centroModelo.set(0, 0, 0);
    $('estado').textContent = 'Sin cerebro.glb: se muestran formas simples de prueba';
    return;
  }
  console.log('Modelo cargado desde ' + usado);
  gltf.scene.traverse(o => { if (o.isMesh) prepararMalla(o); });
  raiz.add(gltf.scene);
  // Se centra y escala el conjunto completo
  const caja = new THREE.Box3().setFromObject(gltf.scene);
  const tam = caja.getSize(new THREE.Vector3());
  const k = 2 / Math.max(tam.x, tam.y, tam.z);
  centroModelo = caja.getCenter(new THREE.Vector3());
  raiz.scale.setScalar(k);
  raiz.position.copy(centroModelo).multiplyScalar(-k);
  crearATV();
  $('estado').textContent = '';
}

/* =========================================================
   4. ASOCIAR MALLAS CON REGIONES (por texto en el nombre)
   ========================================================= */
const cuerpoNombre = (m) => m.userData.nombreNorm.replace(/^allen_/, '').replace(/_(l|r)$/, '');

function asociarRegiones() {
  const directo = {};
  D.regiones.forEach(r => {
    const set = new Set();
    mallas.forEach(m => {
      const n = m.userData.nombreNorm, b = cuerpoNombre(m);
      if ((r.contiene || []).some(t => n.includes(norm(t))) || (r.exacto || []).some(t => b === norm(t))) set.add(m);
    });
    directo[r.id] = set;
  });
  // Resolver "incluye" (grupos) de forma recursiva
  const cache = {};
  const resolver = (id, pila = []) => {
    if (cache[id]) return cache[id];
    if (pila.includes(id)) return directo[id];
    const s = new Set(directo[id]);
    (REG[id].incluye || []).forEach(h => resolver(h, [...pila, id]).forEach(m => s.add(m)));
    return (cache[id] = s);
  };
  D.regiones.forEach(r => { r.mallas = resolver(r.id); });

  // Para cada malla, regiones ordenadas de la más específica (menos piezas) a la más general
  mallas.forEach(m => {
    m.userData.regiones = D.regiones.filter(r => r.mallas.has(m)).sort((a, b) => a.mallas.size - b.mallas.size);
    m.userData.principal = m.userData.regiones[0] || null;
  });

  // Informe en consola
  console.log('Mallas del modelo (' + mallas.length + '):', mallas.map(m => m.name));
  D.regiones.forEach(r => {
    if (!r.mallas.size) console.warn('Región sin mallas asociadas:', r.nombre);
    else console.log(r.nombre + ': ' + r.mallas.size + ' mallas');
  });
  const sin = mallas.filter(m => !m.userData.principal).map(m => m.name);
  console.warn('Mallas sin región (' + sin.length + ', quedan semitransparentes y no seleccionables):', sin);
}

/* =========================================================
   5. ASPECTO (color y opacidad según selección / droga)
   ========================================================= */
let OPACIDAD_FANTASMA = 0.09;   // piezas "apagadas" cuando hay selección
const OPACIDAD_FONDO = 0.1;       // mallas sin región

/* Efecto de una sustancia en una zona. Para el circuito de recompensa se usa la intensidad propia de la sustancia (la que pide el documento). */
function efectoDe(d, regionId) {
  if (d.regiones[regionId]) return d.regiones[regionId];
  if (regionId === 'circuito_recompensa' && d.intensidadRecompensa) return { intensidad: d.intensidadRecompensa, frase: 'Así se compara esta sustancia con otras en el circuito de recompensa.' };
  return null;
}

function intensidadDeMalla(m, drogaId) {
  if (!drogaId) return null;
  for (const r of m.userData.regiones) {
    const e = efectoDe(DROGA[drogaId], r.id);
    if (e) return e;
  }
  return null;
}

function actualizarAspecto() {
  const sel = estado.region ? REG[estado.region] : null;
  mallas.forEach(m => {
    const u = m.userData, prin = u.principal;
    let op, col, brillo = 0, pickable = !!prin, dest = false;   // dest: pieza destacada (no la afecta el deslizador de opacidad)
    const inte = intensidadDeMalla(m, estado.droga);
    const colInt = inte ? new THREE.Color(D.intensidades[inte.intensidad].color) : null;

    if (u.oculta && !estado.sustanciaBlanca) {
      op = 0; col = COLOR_FONDO_SIN_REGION; pickable = false;
    } else if (!prin) {
      op = (u.oculta && !sel && !estado.droga) ? 0.25 : OPACIDAD_FONDO; col = COLOR_FONDO_SIN_REGION; pickable = false;
    } else if (sel) {
      if (sel.mallas.has(m)) { dest = true; op = 1; col = colInt || new THREE.Color(prin.color); brillo = 0.25; }
      else { op = OPACIDAD_FANTASMA; col = COLOR_FONDO_SIN_REGION; pickable = false; }
    } else if (estado.droga) {
      if (inte) { dest = true; op = 1; col = colInt; brillo = 0.2; }
      else { op = OPACIDAD_FANTASMA; col = COLOR_FONDO_SIN_REGION; pickable = false; }
    } else {
      op = 1;
      col = (prin.id === 'corteza_cerebral') ? COLOR_CORTEZA_BASE : new THREE.Color(prin.color);
    }
    u.dest = dest; u.opObjetivo = op; u.colObjetivo = col; u.brillo = brillo; u.pickable = pickable;
  });
}

/* Interpolación suave de color/opacidad y separación (vista explotada) */
const FACTOR_SEPARACION = 0.6;
let sepAplicada = -1;
function animarAspecto() {
  let cambio = false;
  const sepCambio = sepAplicada !== estado.separacion;
  mallas.forEach(m => {
    const u = m.userData, mat = m.material;
    // Con algo seleccionado o una droga elegida, el deslizador solo atenúa el resto del cerebro
    const objetivo = u.dest ? u.opObjetivo : u.opObjetivo * estado.opacidad;
    const h = (hoverRegion && u.pickable && hoverRegion.mallas.has(m)) ? 1 : 0;
    const distCol = Math.abs(u.colActual.r - u.colObjetivo.r) + Math.abs(u.colActual.g - u.colObjetivo.g) + Math.abs(u.colActual.b - u.colObjetivo.b);
    // pieza ya en su estado final: no se toca
    if (u.opActual === objetivo && distCol === 0 && u.hov === h && u.brilloAplicado === u.brillo && !sepCambio) return;
    cambio = true;
    u.opActual += (objetivo - u.opActual) * 0.2;
    if (Math.abs(objetivo - u.opActual) < 0.003) u.opActual = objetivo;
    mat.opacity = u.opActual;
    mat.visible = u.opActual > 0.01;
    mat.depthWrite = u.opActual > 0.97;
    u.colActual.lerp(u.colObjetivo, 0.2);
    if (Math.abs(u.colActual.r - u.colObjetivo.r) + Math.abs(u.colActual.g - u.colObjetivo.g) + Math.abs(u.colActual.b - u.colObjetivo.b) < 0.003) u.colActual.copy(u.colObjetivo);
    mat.color.copy(u.colActual);
    // brillo al pasar el mouse: se suma al brillo propio, sin tocar el color de intensidad
    u.hov += (h - u.hov) * 0.25;
    if (Math.abs(h - u.hov) < 0.01) u.hov = h;
    mat.emissive.copy(u.colActual).multiplyScalar(u.brillo + 0.35 * u.hov);
    u.brilloAplicado = u.brillo;
    // separación: cada pieza se aleja del centro del modelo
    if (sepCambio) m.position.copy(u.centro).sub(centroModelo).multiplyScalar(estado.separacion * FACTOR_SEPARACION).add(u.posBase);
  });
  if (sepCambio) sepAplicada = estado.separacion;
  return cambio;
}

/* =========================================================
   6. CÁMARA ANIMADA
   ========================================================= */
let anim = null;
function irA(pos, target, dur = 700) {
  anim = { t0: performance.now(), dur, p0: camera.position.clone(), p1: pos.clone(),
           t0v: controls.target.clone(), t1v: target.clone() };
}
function pasoCamara(now) {
  if (!anim) return;
  let k = Math.min(1, (now - anim.t0) / anim.dur);
  k = k * k * (3 - 2 * k);
  camera.position.lerpVectors(anim.p0, anim.p1, k);
  controls.target.lerpVectors(anim.t0v, anim.t1v, k);
  if (k >= 1) anim = null;
}
renderer.domElement.addEventListener('pointerdown', () => { anim = null; autoEncuadre = false; });
renderer.domElement.addEventListener('wheel', () => { anim = null; }, { passive: true });

function verInicial() { autoEncuadre = true; irA(VISTA_INICIAL.pos, VISTA_INICIAL.target); }
function reencuadrar() {
  if (!autoEncuadre || !mallas.length) return;
  if (estado.region) enfocar(REG[estado.region]); else irA(VISTA_INICIAL.pos, VISTA_INICIAL.target, 300);
}
function enfocar(region) {
  autoEncuadre = true;
  const caja = new THREE.Box3();
  region.mallas.forEach(m => { m.updateWorldMatrix(true, false); caja.union(new THREE.Box3().setFromObject(m)); });
  if (caja.isEmpty()) return;
  const c = caja.getCenter(new THREE.Vector3());
  const tam = caja.getSize(new THREE.Vector3());
  const r = Math.max(tam.x, tam.y, tam.z) / 2 * 1.1;   // la región llena ~70 % de la vista
  const dist = Math.min(Math.max(distanciaPara(r, 0.7), 1.6), controls.maxDistance);   // mínimo 1,6 para regiones muy pequeñas
  const dir = camera.position.clone().sub(controls.target).normalize();
  irA(c.clone().add(dir.multiplyScalar(dist)), c);
}

/* =========================================================
   7. SELECCIÓN POR CLIC
   ========================================================= */
const rayo = new THREE.Raycaster();
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down) return;
  const mov = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
  down = null;
  if (mov > 6 || dt > 600) return;           // fue un arrastre, no un clic
  const r = renderer.domElement.getBoundingClientRect();
  rayo.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const golpe = rayo.intersectObjects(candidatosPick(), false)[0];
  if (golpe) seleccionar(golpe.object.userData.principal.id);
});

/* =========================================================
   8. INTERFAZ: lista, drogas, ficha
   ========================================================= */
let padreLista = null;   // grupo de la lista por el que se eligió la región
const REGION_RAIZ = D.jerarquia.map(j => j.id);

function construirArbol(filtro = '') {
  const f = norm(filtro.trim());
  const cont = $('arbol'); cont.innerHTML = '';
  let n = 0;
  // Una región puede estar bajo dos grupos (p. ej. accumbens): se marca solo la entrada por donde se llegó
  const padresDe = (id) => D.jerarquia.filter(g => g.hijos.some(h => h.id === id)).map(g => g.id);
  const padreMarcado = estado.region ? (padresDe(estado.region).includes(padreLista) ? padreLista : padresDe(estado.region)[0]) : null;
  const boton = (id, hijo, padre) => {
    const r = REG[id], b = document.createElement('button');
    const activo = estado.region === id && (!hijo || padre === padreMarcado);
    b.type = 'button'; b.className = 'item' + (hijo ? ' hijo' : '') + (activo ? ' activo' : '');
    b.dataset.id = id;
    const inte = estado.droga ? efectoDe(DROGA[estado.droga], id) : null;
    b.innerHTML = '<span class="punto" style="background:' + r.color + '"></span><span>' + r.nombre + '</span>' +
      (inte ? '<span class="badge" style="background:' + D.intensidades[inte.intensidad].color + '">' + D.intensidades[inte.intensidad].nombre + '</span>' : '');
    b.addEventListener('click', () => { padreLista = padre || null; seleccionar(id); cerrarLista(); });
    cont.appendChild(b); n++;
  };
  if (!f || norm(D.cerebroTotal.titulo).includes(f)) {
    const t = document.createElement('button');
    t.type = 'button'; t.className = 'item total' + (estado.region === null ? ' activo' : '');
    t.innerHTML = '<span class="punto" style="background:var(--acento)"></span><span>' + D.cerebroTotal.titulo + '</span>';
    t.addEventListener('click', () => { mostrarTodo(); cerrarLista(); });
    cont.appendChild(t); n++;
  }
  D.jerarquia.forEach(g => {
    const hijos = g.hijos.filter(h => !f || norm(REG[h.id].nombre).includes(f));
    if (!f || norm(REG[g.id].nombre).includes(f) || hijos.length) {
      boton(g.id, false, null);
      (f && !norm(REG[g.id].nombre).includes(f) ? hijos : g.hijos).forEach(h => boton(h.id, true, g.id));
    }
  });
  if (!n) cont.innerHTML = '<div class="vacio">No hay regiones con ese nombre.</div>';
}

estado.tipoVisible = D.tiposDroga[0].id; estado.verTipo = false;
function construirDrogas() {
  const fila = $('filaTipos');
  D.tiposDroga.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn tipo'; b.dataset.tipo = t.id; b.setAttribute('aria-label', t.nombre);
    b.innerHTML = '<span class="t-largo">' + t.nombre + '</span><span class="t-corto">' + (t.corto || t.nombre) + '</span>';
    b.addEventListener('click', () => { estado.tipoVisible = t.id; estado.verTipo = true; refrescarUI(); });
    fila.appendChild(b);
  });
  pintarFilaDrogas();
}
/* Muestra las sustancias del tipo elegido (primer nivel: tipo; segundo nivel: sustancia) */
function pintarFilaDrogas() {
  const fila = $('filaDrogas');
  fila.querySelectorAll('.btn[data-id]').forEach(b => b.remove());
  D.drogas.filter(d => d.tipoId === estado.tipoVisible).forEach(d => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn'; b.dataset.id = d.id; b.textContent = d.nombre;
    b.addEventListener('click', () => elegirDroga(estado.droga === d.id ? null : d.id));
    fila.insertBefore(b, $('btnAtras'));
  });
  document.querySelectorAll('#filaTipos .btn.tipo').forEach(b => b.classList.toggle('sel', b.dataset.tipo === estado.tipoVisible));
  fila.querySelectorAll('.btn[data-id]').forEach(b => b.classList.toggle('activo', b.dataset.id === estado.droga));
  // en celular las filas se deslizan: se deja a la vista el tipo y la sustancia elegidos
  const aVer = [document.querySelector('#filaTipos .btn.tipo.sel'), fila.querySelector('.btn.activo')];
  aVer.forEach(b => { if (b) b.scrollIntoView({ inline: 'center', block: 'nearest' }); });
}

function leyendaIntensidad() {
  const l = $('leyenda');
  l.classList.toggle('on', !!estado.droga);
  l.innerHTML = Object.values(D.intensidades).map(i =>
    '<span><i class="punto" style="background:' + i.color + '"></i>' + i.nombre + '</span>').join('');
}

function badge(inte) {
  const i = D.intensidades[inte];
  return '<span class="badge-int" style="background:' + i.color + '">Intensidad ' + i.nombre.toLowerCase() + '</span>';
}

function pintarFicha() {
  const c = $('fichaCuerpo'), r = estado.region ? REG[estado.region] : null, d = estado.droga ? DROGA[estado.droga] : null;
  let h = '';
  if (r) {
    h += '<h2>' + r.nombre + '</h2><div class="tipo">' + (r.tipo === 'grupo' ? 'Grupo de zonas' : 'Región') + (r.parte ? ' · parte de ' + REG[r.parte].nombre : '') + '</div>';
    if (r.nota) h += '<div class="nota">⚠ ' + r.nota + '</div>';
    h += '<h3>Dónde está</h3><p>' + r.donde + '</p><h3>Qué hace</h3><p>' + r.funcion + '</p>' +
         '<h3>Neurotransmisor principal</h3><p>' + r.neurotransmisor + '</p><h3>Rol en la adicción</h3><p>' + r.adiccion + '</p>';
    if (d) {
      const e = efectoDe(d, r.id);
      h += '<div class="caja"><strong>Efecto de ' + d.nombre + '</strong><div style="margin:8px 0">' +
        (e ? badge(e.intensidad) + '</div><p>' + e.frase + '</p>'
           : '</div><p>' + (r.tipo === 'grupo' ? 'Este grupo no tiene un dato propio para esta sustancia. Elige una de sus partes.' : 'Todavía no hay un dato de esta sustancia para esta zona.') + '</p>') + '</div>';
      h += '<div class="nota">' + D.avisoIntensidad + '</div>';
      if (!e && r.tipo === 'grupo') h += chipsHijos(r, d);
    }
    if (r.tipo === 'grupo' && !d) h += chipsHijos(r, null);
  } else if (d) {
    h += '<h2>' + d.nombre + '</h2><div class="tipo">' + d.tipo + '</div><p style="margin-top:10px">' + d.resumen + '</p>' +
         '<div class="rec"><strong>Efecto en el circuito de recompensa:</strong> ' + badge(d.intensidadRecompensa) + '</div>' +
         '<h3>Zonas afectadas</h3><div class="chips">' +
         Object.entries(d.regiones).sort((a, b) => ['alta', 'media', 'baja'].indexOf(a[1].intensidad) - ['alta', 'media', 'baja'].indexOf(b[1].intensidad))
           .map(([id, e]) => '<button type="button" class="chip" data-r="' + id + '" style="border-left:6px solid ' + D.intensidades[e.intensidad].color + '">' + REG[id].nombre + '</button>').join('') +
         '</div><div class="nota">' + D.avisoIntensidad + '</div>' +
         '<p class="tipo" style="margin-top:12px">Toca una zona (en el cerebro o aquí) para ver el detalle.</p>';
  } else if (estado.verTipo) {
    const t = D.tiposDroga.find(x => x.id === estado.tipoVisible);
    h = '<h2>' + t.nombre + '</h2><div class="tipo">Tipo de sustancia</div><p style="margin-top:10px">' + t.descripcion + '</p>' +
        '<h3>Sustancias</h3><div class="chips">' +
        D.drogas.filter(x => x.tipoId === t.id).map(x => '<button type="button" class="chip" data-d="' + x.id + '">' + x.nombre + '</button>').join('') +
        '</div><p class="tipo" style="margin-top:12px">Elige una sustancia, arriba o aquí, para ver qué zonas afecta.</p>';
  } else {
    const t = D.cerebroTotal;
    h = '<h2>' + t.titulo + '</h2><div class="tipo">' + D.leyendaContenido + '</div>' +
        t.intro.map(p => '<p style="margin-top:12px">' + p + '</p>').join('') +
        '<p class="tipo" style="margin-top:14px">Gira con el mouse, acerca con la rueda y mueve con el botón derecho.</p>';
  }
  c.innerHTML = h;
  c.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => seleccionar(b.dataset.r)));
  c.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => elegirDroga(b.dataset.d)));
  $('fichaTitulo').textContent = r ? r.nombre : d ? d.nombre : estado.verTipo ? D.tiposDroga.find(x => x.id === estado.tipoVisible).nombre : D.cerebroTotal.titulo;
}

function chipsHijos(r, d) {
  const ids = D.regiones.filter(x => x.tipo === 'region' && r.mallas.size && [...x.mallas].every(m => r.mallas.has(m)) && x.mallas.size).map(x => x.id);
  if (!ids.length) return '';
  return '<h3>Partes</h3><div class="chips">' + ids.map(id => '<button type="button" class="chip" data-r="' + id + '">' + REG[id].nombre + '</button>').join('') + '</div>';
}

function refrescarUI() {
  actualizarAspecto();
  ptr.sucio = true;
  construirArbol($('buscar').value);
  pintarFilaDrogas();
  leyendaIntensidad();
  pintarFicha();
  $('btnAtras').disabled = $('btnAtrasF').disabled = historial.length === 0;
}

/* Historial para el botón "Atrás": guarda (región, droga) antes de cada cambio */
const historial = [];
function guardarHistorial() {
  historial.push({ region: estado.region, droga: estado.droga });
  if (historial.length > 50) historial.shift();
}
function atras() {
  const u = historial.pop();
  if (!u) return;
  estado.region = u.region; estado.droga = u.droga; estado.verTipo = false;
  if (u.droga) estado.tipoVisible = DROGA[u.droga].tipoId;
  refrescarUI();
  if (u.region) { enfocar(REG[u.region]); desplegarFicha(); }
  else verInicial();
}

function seleccionar(id) {
  estado.verTipo = false;
  if (id !== estado.region) guardarHistorial();
  estado.region = id;
  refrescarUI();
  enfocar(REG[id]);
  desplegarFicha();
}
function elegirDroga(id) { if (id) estado.verTipo = false; if (id !== estado.droga) guardarHistorial(); estado.droga = id; if (id) estado.tipoVisible = DROGA[id].tipoId; refrescarUI(); }
function mostrarTodo() {
  estado.verTipo = false;
  if (estado.region !== null || estado.droga !== null) guardarHistorial();
  estado.region = null; estado.droga = null; refrescarUI();
  verInicial();
}

/* Lista y ficha plegables en celular */
const abrirLista = () => $('lista').classList.add('abierta');
function cerrarLista() { $('lista').classList.remove('abierta'); }
$('btnRegiones').addEventListener('click', () => $('lista').classList.toggle('abierta'));
$('fichaCab').addEventListener('click', () => {
  const p = $('ficha').classList.toggle('plegada');
  $('fichaFlecha').textContent = p ? '▴' : '▾';
});
function desplegarFicha() { $('ficha').classList.remove('plegada'); $('fichaFlecha').textContent = '▾'; }

/* Controles */
$('buscar').addEventListener('input', (e) => construirArbol(e.target.value));
$('sOpacidad').addEventListener('input', (e) => { estado.opacidad = e.target.value / 100; });
$('sSeparacion').addEventListener('input', (e) => { estado.separacion = e.target.value / 100; });
$('btnAuto').addEventListener('click', (e) => {
  controls.autoRotate = !controls.autoRotate;
  e.currentTarget.classList.toggle('activo', controls.autoRotate);
  e.currentTarget.setAttribute('aria-pressed', controls.autoRotate);
});
$('btnAtras').addEventListener('click', atras);
$('btnAtrasF').addEventListener('click', atras);
$('btnRegionesF').addEventListener('click', abrirLista);
$('btnCerrarLista').addEventListener('click', cerrarLista);
$('btnAjustes').addEventListener('click', (e) => {
  const on = $('centro').classList.toggle('ajustes');
  e.currentTarget.classList.toggle('activo', on); e.currentTarget.setAttribute('aria-pressed', on);
});
$('btnReiniciar').addEventListener('click', verInicial);
$('btnInicio').addEventListener('click', verInicial);
/* Zoom con botones (+ y −): acerca o aleja la cámara hacia el punto que mira, respetando los límites */
function zoomBoton(factor) {
  autoEncuadre = false;
  const dir = (anim ? anim.p1 : camera.position).clone().sub(controls.target);   // si ya hay un zoom en curso, se suma a ese destino
  const d = Math.min(Math.max(dir.length() * factor, controls.minDistance), controls.maxDistance);
  irA(controls.target.clone().add(dir.setLength(d)), controls.target, 250);
}
$('btnZoomMas').addEventListener('click', () => zoomBoton(0.72));
$('btnZoomMenos').addEventListener('click', () => zoomBoton(1 / 0.72));
$('chkBlanca').addEventListener('change', (e) => { estado.sustanciaBlanca = e.target.checked; actualizarAspecto(); });

/* =========================================================
   8b. EFECTO AL PASAR EL MOUSE (como BrainFacts)
   ========================================================= */
const etiquetaHover = $('etiquetaHover');
const cv = renderer.domElement;
let hoverRegion = null;
const ptr = { cx: 0, cy: 0, dentro: false, sucio: false, arrastrando: false };
let ultimoRayoHover = 0;

/* Solo se pueden tocar las piezas visibles y seleccionables; las "fantasma" se atraviesan */
function candidatosPick() { return mallas.filter(m => m.userData.pickable && m.material.visible); }

function fijarHoverRegion(region) {
  hoverRegion = region;
  cv.style.cursor = region ? 'pointer' : '';
  if (!region) { etiquetaHover.hidden = true; return; }
  etiquetaHover.textContent = region.nombre;      // nombre en español de la ficha, nunca el de la malla
  etiquetaHover.hidden = false;
  posicionarEtiqueta();
}
function posicionarEtiqueta() {
  const r = cont.getBoundingClientRect();
  const x = Math.min(ptr.cx - r.left + 14, r.width - etiquetaHover.offsetWidth - 6);
  const y = Math.min(ptr.cy - r.top + 18, r.height - etiquetaHover.offsetHeight - 6);
  etiquetaHover.style.left = Math.max(4, x) + 'px';
  etiquetaHover.style.top = Math.max(4, y) + 'px';
}
cv.addEventListener('pointermove', (e) => {
  ptr.cx = e.clientX; ptr.cy = e.clientY; ptr.dentro = true; ptr.sucio = true;
  if (hoverRegion) posicionarEtiqueta();
});
cv.addEventListener('pointerdown', () => { ptr.arrastrando = true; fijarHoverRegion(null); });
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, (e) => {
  ptr.arrastrando = false; ptr.sucio = true;
  if (e.pointerType !== 'mouse') { ptr.dentro = false; fijarHoverRegion(null); }
}));
cv.addEventListener('pointerleave', () => { ptr.dentro = false; fijarHoverRegion(null); });

/* El raycast corre como máximo una vez cada 70 ms y solo si el mouse se movió */
function pasoHover(now) {
  if (!ptr.dentro || ptr.arrastrando) return;
  if (!ptr.sucio || now - ultimoRayoHover < 70) return;
  ptr.sucio = false; ultimoRayoHover = now;
  const r = cv.getBoundingClientRect();
  rayo.setFromCamera(new THREE.Vector2(((ptr.cx - r.left) / r.width) * 2 - 1, -((ptr.cy - r.top) / r.height) * 2 + 1), camera);
  const golpe = rayo.intersectObjects(candidatosPick(), false)[0];
  const region = golpe ? golpe.object.userData.principal : null;
  if (region !== hoverRegion) fijarHoverRegion(region);
}

/* =========================================================
   8c. TEMA CLARO / OSCURO
   ========================================================= */
const TEMAS = {
  dark:  { fondo: '#0f0f26', fantasma: '#6a7090', corteza: '#d9c3bb', opFantasma: 0.09, hemi: 1.1, dir: 1.6, ico: '☀', txt: ' Modo día' },
  light: { fondo: '#e9eaf2', fantasma: '#7d86a0', corteza: '#c4a095', opFantasma: 0.12, hemi: 1.5, dir: 1.1, ico: '🌙', txt: ' Modo noche' }
};
function aplicarTema(t, guardar) {
  const T = TEMAS[t] || TEMAS.dark;
  document.documentElement.dataset.tema = TEMAS[t] ? t : 'dark';
  scene.background.set(T.fondo);
  luzHemi.intensity = T.hemi; luz.intensity = T.dir;
  COLOR_FONDO_SIN_REGION.set(T.fantasma); COLOR_CORTEZA_BASE.set(T.corteza);
  OPACIDAD_FANTASMA = T.opFantasma;
  pedirRender();
  $('btnTema').innerHTML = '<span class="ico">' + T.ico + '</span><span class="txt">' + T.txt + '</span>';
  $('btnTema').setAttribute('aria-pressed', t === 'light');
  if (mallas.length) actualizarAspecto();
  if (guardar) { try { localStorage.setItem('cerebro_tema', t); } catch (e) { /* sin almacenamiento: funciona igual */ } }
}
$('btnTema').addEventListener('click', () => {
  aplicarTema(document.documentElement.dataset.tema === 'light' ? 'dark' : 'light', false);
});

/* =========================================================
   9. ARRANQUE
   ========================================================= */
$('aviso').textContent = D.leyendaContenido;
// Encabezado: título, subtítulo – créditos (versión). En celular se oculta el subtítulo para que quepan los créditos.
const E = D.encabezado;
$('tTitulo').textContent = E.titulo;
$('tSub').innerHTML = '<span class="t-tema">' + E.subtitulo + ' – </span><span class="t-cred">' + E.creditos + '</span> <span class="t-ver">(' + E.version + ')</span>';
if (window.matchMedia('(max-width: 900px)').matches) { $('ficha').classList.add('plegada'); $('fichaFlecha').textContent = '▴'; }
aplicarTema(document.documentElement.dataset.tema, false);
const M = D.modelo;
$('pie').innerHTML = '<div class="derechos">' + D.derechos + '</div><div class="modelo-cita">Modelo 3D: ' + M.cita + ' <a href="' + M.url + '" target="_blank" rel="noopener">' + M.textoEnlace + '</a>. ' +
  M.base + ' Atribución: ' + M.atribucion + ' Licencia <a href="' + M.urlLicencia + '" target="_blank" rel="noopener">' + M.licencia + '</a>.</div>';
construirDrogas();
ajustarTamano();
camera.position.copy(VISTA_INICIAL.pos);   // ya con el tamaño real de la vista

await cargarModelo();
asociarRegiones();
refrescarUI();
mallas.forEach(m => { m.userData.opActual = m.userData.opObjetivo; m.userData.colActual.copy(m.userData.colObjetivo); });

function bucle(now) {
  requestAnimationFrame(bucle);
  const habiaAnim = !!anim;
  pasoCamara(now);
  pasoHover(now);
  const cambio = animarAspecto();
  const moviendo = controls.update();      // true mientras la cámara se mueve (arrastre, inercia, rotación automática)
  if (habiaAnim || cambio || moviendo || renderPendiente > 0) {
    renderer.render(scene, camera);
    if (renderPendiente > 0) renderPendiente--;
  }
}
requestAnimationFrame(bucle);
window.__cerebro = { estado, seleccionar, elegirDroga, REG, mallas, renderer, scene, camera, aplicarTema, fijarHoverRegion }; // ayuda para pruebas en consola
</script>
</body>
</html>
